<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<script>

window.addEventListener("load", async () => {
    if ("LanguageModel" in window) {
        const available = await LanguageModel.availability({
            expectedInputs: [{type: 'text', languages: ['en']}],
            expectedOutputs: [{type: 'text', languages: ['en']}],
        });
        if (available !== 'unavailable') {
            const session = await LanguageModel.create({
                monitor(m) {
                    m.addEventListener('downloadprogress', (e) => {
                        if (e.loaded < 1) {
                            document.getElementById("messages").textContent = `Model downloaded ${e.loaded * 100}%`;
                        } else {
                            document.getElementById("messages").textContent = `Ready. Model downloaded`;
                        }
                    });
                },
            });

            document.getElementById("controls").style.display = "block";

            document.getElementById("send").addEventListener("click", async () => {
                const msg = document.getElementById("inp").value;
                document.getElementById("inp").value = "";
                console.log("Sending " + msg);
                const user = document.createElement("div");
                user.className="user";
                user.textContent = msg;
                const messages = document.getElementById("messages");
                messages.appendChild(user);
                const assistant = document.createElement("div");
                assistant.className = "assistant";
                messages.appendChild(assistant);
                const stream = session.promptStreaming(msg);
                let full = "";
                for await (const chunk of stream) {
                    full += chunk;
                    assistant.innerHTML = marked.parse(full);
                }
            });


        } else {
            document.getElementById("error").style.display = "block";
        }
    } else {
        document.getElementById("error").style.display = "block";
    }

});
</script>
<style>
body {
    margin: 2em;
}
#messages {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}
#messages > div {
    margin-bottom: 1em;
    background: #eee;
    padding: 0.5em;
    border-radius: 0.5em;
    align-self: flex-start;
    display: inline-block;
    max-width: 60%;
}
#messages > div.user {
    align-self: flex-end;
    background: #bbf;
}
#inp {
    display: block;
}
button {
    margin-top: 0.25em;
}
#error {
    display: none;
}
</style>
</head>
<body>
<div id="error">
    Only works on Chrome for desktop. Could not load model. You might have to set:
<pre>chrome://flags/#optimization-guide-on-device-model
chrome://flags/#prompt-api-for-gemini-nano-multimodal-input</pre>
</div>

<div id="messages"></div>

<div id="controls" style="display: none;">
    <textarea id="inp"></textarea>
    <button id="send">Send</button>
</div>
</body>
</html>
